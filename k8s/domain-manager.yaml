apiVersion: v1
kind: ServiceAccount
metadata:
  name: domain-manager-sa
  namespace: keycloak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: domain-manager-role
  namespace: keycloak
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: domain-manager-binding
  namespace: keycloak
subjects:
  - kind: ServiceAccount
    name: domain-manager-sa
    namespace: keycloak
roleRef:
  kind: Role
  name: domain-manager-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: domain-manager
  namespace: keycloak
spec:
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: domain-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: domain-manager
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: domain-manager
  template:
    metadata:
      labels:
        app: domain-manager
    spec:
      serviceAccountName: domain-manager-sa
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: domain-manager
          image: domain-manager:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["/bin/sh", "-c"]
          args:
            [
              "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000",
            ]
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: domain-manager-secret
                  key: DATABASE_URL
            - name: KEYCLOAK_SERVER_URL
              value: "http://keycloak:8080"
            - name: KEYCLOAK_REALM
              value: "master"
            - name: KEYCLOAK_CLIENT_ID
              value: "domain-manager"
            - name: ADMIN_ROLES
              value: "admin,keycluster-admin,realm-admin"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      volumes:
        - name: tmp
          emptyDir: {}

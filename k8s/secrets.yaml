apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  namespace: keycloak
type: Opaque
stringData:
  POSTGRES_PASSWORD: "secure-password-replace-me"
  KC_DB_PASSWORD: "secure-password-replace-me"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-secret
  namespace: keycloak
type: Opaque
stringData:
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "secure-admin-password-replace-me"
---
apiVersion: v1
kind: Secret
metadata:
  name: domain-manager-secret
  namespace: keycloak
type: Opaque
stringData:
  # User to replace this with actual connection string
  # Format: postgresql+asyncpg://user:password@host:port/dbname
  DATABASE_URL: "postgresql+asyncpg://keycloak:secure-password-replace-me@postgres:5432/keycloak"

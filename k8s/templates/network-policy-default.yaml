apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-keycloak
  namespace: keycloak
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-keycloak
  namespace: keycloak
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
  - Ingress
  ingress:
  - from:
    # Allow from Ingress Controller (nginx)
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    # Allow from Domain Manager (internal)
    - podSelector:
        matchLabels:
          app: domain-manager
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-postgres
  namespace: keycloak
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: keycloak
    - podSelector:
        matchLabels:
          app: domain-manager
    ports:
    - protocol: TCP
      port: 5432

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "keycluster"
version = "0.1.0"
description = "Keycluster Domain Manager Library"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "kubernetes-asyncio==31.1.0",
    "pydantic==2.10.4",
    "sqlmodel==0.0.22",
    "alembic==1.14.1",
    "asyncpg==0.30.0",
    "httpx==0.28.1",
    "cryptography==46.0.5",
    "slowapi==0.1.9"
]

[tool.hatch.build.targets.wheel]
packages = ["app", "keycluster"]

# Project metadata and test config for domain-manager.
# The image still installs from requirements.txt (see Dockerfile); keep the
# pins below identical to requirements.txt and requirements-dev.txt.
[project]
name = "domain-manager"
version = "0.1.0"
description = "Keycluster domain-manager: realm, domain, theme and service-account API in front of Keycloak"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "kubernetes-asyncio==31.1.0",
    "pydantic==2.10.4",
    "sqlmodel==0.0.22",
    "alembic==1.14.1",
    "asyncpg==0.30.0",
    "httpx==0.28.1",
    "cryptography==46.0.5",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
